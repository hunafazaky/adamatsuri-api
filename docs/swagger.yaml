basePath: /api
definitions:
  dto.BookingResponse:
    properties:
      booking_code:
        type: string
      event:
        $ref: '#/definitions/dto.EventResponse'
      id:
        type: integer
      phone:
        type: string
    type: object
  dto.BookingSummaryResponse:
    properties:
      booking_code:
        type: string
      id:
        type: integer
      phone:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.EventDetailResponse:
    properties:
      bookings:
        items:
          $ref: '#/definitions/dto.BookingSummaryResponse'
        type: array
      category:
        $ref: '#/definitions/model.Category'
      created_at:
        type: string
      datetime:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      name:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.EventListMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_page:
        type: integer
      total_rows:
        type: integer
    type: object
  dto.EventResponse:
    properties:
      category:
        $ref: '#/definitions/model.Category'
      created_at:
        type: string
      datetime:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      name:
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.SignInResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        $ref: '#/definitions/model.Role'
    type: object
  model.Category:
    enum:
    - convention
    - doujin_market
    - screening
    - cosplay_contest
    - game_tournament
    - meetup
    type: string
    x-enum-comments:
      CategoryConvention: large multi-vendor/multi-panel event
      CategoryCosplayContest: cosplay competition or gathering
      CategoryDoujinMarket: artist alley / fan-work sales
      CategoryGameTournament: anime/visual-novel game tournament
      CategoryMeetup: casual fan meetup
      CategoryScreening: anime/movie screening
    x-enum-descriptions:
    - large multi-vendor/multi-panel event
    - artist alley / fan-work sales
    - anime/movie screening
    - cosplay competition or gathering
    - anime/visual-novel game tournament
    - casual fan meetup
    x-enum-varnames:
    - CategoryConvention
    - CategoryDoujinMarket
    - CategoryScreening
    - CategoryCosplayContest
    - CategoryGameTournament
    - CategoryMeetup
  model.Role:
    enum:
    - attendee
    - organizer
    - admin
    type: string
    x-enum-varnames:
    - RoleAttendee
    - RoleOrganizer
    - RoleAdmin
  response.Envelope:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  service.CreateBookingInput:
    properties:
      event_id:
        example: 1
        type: integer
      phone:
        example: "+6281234567890"
        type: string
    type: object
  service.SignInInput:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  service.SignUpInput:
    properties:
      email:
        example: jane@example.com
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        description: |-
          Role is optional and defaults to "attendee" when omitted. Only
          "attendee" and "organizer" may be requested here — "admin" is
          deliberately not reachable through sign-up.
        enum:
        - attendee
        - organizer
        example: attendee
    required:
    - email
    - name
    - password
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API for browsing events and managing bookings.

    **Authentication:** call `POST /auth/signin` (or
    `/auth/signup` first, if you don't have an account) to
    get a token. Then click "Authorize" (top right) and
    enter it as `Bearer <your-token>`. Endpoints marked
    with a padlock require this.

    **Errors:** every response uses the same envelope —
    `{ success, message, data, meta, error }`. On failure,
    `error` holds a human-readable message and `data`/`meta`
    are omitted.
  title: Event Booking API
  version: "1.0"
paths:
  /auth/me:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get user's data
      tags:
      - Auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT with the user's profile.
      parameters:
      - description: Sign in payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.SignInInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.SignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Sign In
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: Sign up payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.SignUpInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Sign Up
      tags:
      - Auth
  /bookings:
    get:
      description: Returns all bookings belonging to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.BookingResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get user's booking list
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Creates a booking for an event for the authenticated user.
      parameters:
      - description: Booking payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.CreateBookingInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create a booking
      tags:
      - Bookings
  /bookings/{id}:
    delete:
      description: Deletes a booking owned by the authenticated user.
      parameters:
      - description: Booking ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete a booking
      tags:
      - Bookings
  /events:
    get:
      description: Returns a paginated list of events, optionally filtered by search
        term.
      parameters:
      - description: Search by name or description
        example: conference
        in: query
        name: search
        type: string
      - description: Filter by category
        enum:
        - convention
        - doujin_market
        - screening
        - cosplay_contest
        - game_tournament
        - meetup
        in: query
        name: category
        type: string
      - description: Filter by fandom/genre tag name
        example: shounen
        in: query
        name: tag
        type: string
      - description: Page number (default 1)
        example: 1
        in: query
        name: page
        type: integer
      - description: Results per page (default 6)
        example: 6
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EventResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.EventListMeta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get event list
      tags:
      - Events
    post:
      consumes:
      - multipart/form-data
      description: Creates a new event for the authenticated user.
      parameters:
      - description: Event name
        example: Tech Conference 2026
        in: formData
        name: name
        required: true
        type: string
      - description: Event description
        example: A conference about the latest in tech
        in: formData
        name: description
        required: true
        type: string
      - description: Event location
        example: Jakarta, Indonesia
        in: formData
        name: location
        required: true
        type: string
      - description: RFC3339 datetime
        example: "2026-12-01T09:00:00Z"
        in: formData
        name: datetime
        required: true
        type: string
      - description: Event category
        enum:
        - convention
        - doujin_market
        - screening
        - cosplay_contest
        - game_tournament
        - meetup
        in: formData
        name: category
        required: true
        type: string
      - description: Comma-separated fandom/genre tags
        example: Jujutsu Kaisen, shounen
        in: formData
        name: tags
        type: string
      - description: Event image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create an event
      tags:
      - Events
  /events/{id}:
    delete:
      description: Deletes an event owned by the authenticated user.
      parameters:
      - description: Event ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete an event
      tags:
      - Events
    get:
      description: Returns an event by ID, including its bookings.
      parameters:
      - description: Event ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get an event
      tags:
      - Events
    put:
      consumes:
      - multipart/form-data
      description: Updates an event owned by the authenticated user.
      parameters:
      - description: Event ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: Event name
        example: Tech Conference 2026 - Updated
        in: formData
        name: name
        type: string
      - description: Event description
        example: A conference about the latest in tech
        in: formData
        name: description
        type: string
      - description: Event location
        example: Jakarta, Indonesia
        in: formData
        name: location
        type: string
      - description: RFC3339 datetime
        example: "2026-12-01T09:00:00Z"
        in: formData
        name: datetime
        type: string
      - description: Event category
        enum:
        - convention
        - doujin_market
        - screening
        - cosplay_contest
        - game_tournament
        - meetup
        in: formData
        name: category
        type: string
      - description: Comma-separated fandom/genre tags — replaces the full tag set
        example: Jujutsu Kaisen, shounen
        in: formData
        name: tags
        type: string
      - description: Event image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update an event
      tags:
      - Events
  /events/mine:
    get:
      description: Returns events created by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EventResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get user's event list
      tags:
      - Events
  /tags:
    get:
      description: Returns every fandom/genre tag currently in use, for building a
        filter UI or a tag picker.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TagResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get all tags
      tags:
      - Tags
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
